plugins {
    id 'java'
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation group: 'com.itextpdf',           name: 'itext7-core',    version: '7.1.11'
    implementation group: 'com.google.code.gson',   name: 'gson',           version: '2.8.0'
    implementation group: 'org.slf4j',              name: 'slf4j-log4j12',  version: '1.7.30'
}

group = 'endeavor85'
version = '0.2.3'
sourceCompatibility = '1.8'

// jar task modification to include dependencies
jar {
    manifest {
        attributes 'Main-Class': 'endeavor85.billsorter.BillSorter'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.compileClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
    }{
        exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    }
    // from { (configurations.runtime).collect { it.isDirectory() ? it : zipTree(it) } } {
    //     exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    // }
}
